---
- name: Ubuntu/Debian VM dotfiles install
  hosts: ubuntu_vms:debian_vms
  become: true
  gather_facts: false

  vars_files:
    - vault.yml

  vars:
    main_user: >-
      {{
        ubuntu_main_user
        if 'ubuntu_vms' in group_names
        else
        trixie_main_user
        if 'debian_vms' in group_names
        else
        'none'
      }}
    enable_xrdp: true
    enable_dcv: false
    xrdp_user: >-
      {{
        ubuntu_xrdp_user
        if 'ubuntu_vms' in group_names
        else
        trixie_xrdp_user
        if 'debian_vms' in group_names
        else
        'none'
      }}
    dcv_user: >-
      {{
        ubuntu_dcv_user
        if 'ubuntu_vms' in group_names
        else
        trixie_dcv_user
        if 'debian_vms' in group_names
        else
        'none'
      }}
    customize_users: >-
      {{
        [
          main_user,
          (xrdp_user if (enable_xrdp | bool) else ''),
          (dcv_user if (enable_dcv | bool) else '')
        ]
        | reject('equalto', '')
        | reject('equalto', 'none')
        | unique
        | list
      }}
    dotfiles_repo: "https://github.com/mihaifm/dotfiles"

  tasks:
    - name: Ensure git is installed
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true

    - name: Clone dotfiles repository
      become_user: "{{ dotfiles_user }}"
      ansible.builtin.git:
        repo: "{{ dotfiles_repo }}"
        dest: "/home/{{ dotfiles_user }}/dotfiles"
        update: true
      loop: "{{ customize_users }}"
      loop_control:
        loop_var: dotfiles_user

    - name: Install dotfiles repo files
      become_user: "{{ dotfiles_user }}"
      ansible.builtin.command:
        cmd: ./install.sh repo
        chdir: "/home/{{ dotfiles_user }}/dotfiles"
      environment:
        HOME: "/home/{{ dotfiles_user }}"
      loop: "{{ customize_users }}"
      loop_control:
        loop_var: dotfiles_user

    - name: Bootstrap dotfiles
      become_user: "{{ dotfiles_user }}"
      ansible.builtin.command:
        cmd: ./install.sh bootstrap
        chdir: "/home/{{ dotfiles_user }}/dotfiles"
      environment:
        HOME: "/home/{{ dotfiles_user }}"
      loop: "{{ customize_users }}"
      loop_control:
        loop_var: dotfiles_user
