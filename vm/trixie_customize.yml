---
- name: Debian VM desktop customization
  hosts: debian_vms
  become: true
  gather_facts: false

  vars_files:
    - vault.yml

  vars:
    enable_xrdp: true
    enable_spice: true
    enable_dcv: false

    desktop_environment: "none"
    main_user: "{{ trixie_main_user }}"
    xrdp_user: "{{ trixie_xrdp_user }}"
    dcv_user: "{{ trixie_dcv_user }}"
    customize_users: >-
      {{
        [
          main_user,
          (xrdp_user if (enable_xrdp | bool) else ''),
          (dcv_user if (enable_dcv | bool) else '')
        ]
        | reject('equalto', '')
        | unique
        | list
      }}

    distro: "debian"

  tasks:
    - name: Desktop customization
      block:
        - ansible.builtin.import_tasks: customize_gnome.yml
          when: desktop_environment == "gnome"

        - ansible.builtin.import_tasks: customize_kde.yml
          when: desktop_environment == "kde"

        - ansible.builtin.import_tasks: customize_xfce.yml
          when: desktop_environment == "xfce"
