---
- name: Customize xfce
  vars:
    xfce_gtk_theme: Arc-Dark
    xfce_icon_theme: Papirus-Dark
  block:
    - name: Install theme and icon packages
      ansible.builtin.apt:
        name: ["arc-theme", "papirus-icon-theme"]
        state: present

    - name: Apply XFCE customization for each configured desktop user
      ansible.builtin.include_tasks: customize_xfce_user.yml
      loop: "{{ customize_users }}"
      loop_control:
        loop_var: customize_user
